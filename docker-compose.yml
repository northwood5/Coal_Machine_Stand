services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coal
      POSTGRES_PASSWORD: coal_dev_password
      POSTGRES_DB: coal_stand
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coal"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://coal:coal_dev_password@db:5432/coal_stand
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
